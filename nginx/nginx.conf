# =============================================================================
# Thena — Nginx Reverse Proxy + SSL Configuration
# =============================================================================
# CHANGE THIS: Replace 'your-domain.com' with your actual domain name.
# SSL certificates are expected at /etc/letsencrypt/live/$DOMAIN/
# Mount via volume in docker-compose.prod.yml:
#   volumes:
#     - /etc/letsencrypt:/etc/letsencrypt:ro
# =============================================================================

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

# Maximum number of simultaneous connections per worker
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_comp_level    5;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml application/xml+rss text/javascript;

    # -----------------------------------------------------------------
    # Rate limiting zones
    # -----------------------------------------------------------------
    # General API rate limit: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Auth endpoints: 5 requests/second per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # -----------------------------------------------------------------
    # Upstream definitions
    # -----------------------------------------------------------------
    upstream server_upstream {
        server server:3000;
        keepalive 32;
    }

    upstream engine_upstream {
        server engine:8000;
        keepalive 16;
    }

    upstream client_upstream {
        server client:5173;
        keepalive 16;
    }

    # -----------------------------------------------------------------
    # HTTP → HTTPS redirect (port 80)
    # -----------------------------------------------------------------
    server {
        listen 80;
        # CHANGE THIS: Replace with your actual domain name
        server_name your-domain.com www.your-domain.com;

        # Allow Let's Encrypt ACME challenge (cert renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------
    # HTTPS server (port 443)
    # -----------------------------------------------------------------
    server {
        listen 443 ssl http2;
        # CHANGE THIS: Replace with your actual domain name
        server_name your-domain.com www.your-domain.com;

        # ------------------------------------------------------------------
        # SSL — Let's Encrypt certificates
        # CHANGE THIS: Replace 'your-domain.com' with your actual domain
        # ------------------------------------------------------------------
        ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        # SSL hardening — allow only TLS 1.2 and 1.3
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:'
                    'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:'
                    'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:'
                    'DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # Session caching for performance
        ssl_session_timeout  1d;
        ssl_session_cache    shared:MozSSL:10m;
        ssl_session_tickets  off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # ------------------------------------------------------------------
        # Security headers
        # ------------------------------------------------------------------
        add_header X-Frame-Options           "SAMEORIGIN"           always;
        add_header X-Content-Type-Options    "nosniff"              always;
        add_header X-XSS-Protection          "1; mode=block"        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        # HSTS — tell browsers to use HTTPS for 1 year (includeSubDomains)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Hide Nginx version in error pages and headers
        server_tokens off;

        # ------------------------------------------------------------------
        # Client body size (for file uploads — DOCX thesis documents)
        # CHANGE THIS: Adjust max upload size as needed
        # ------------------------------------------------------------------
        client_max_body_size 50M;

        # ------------------------------------------------------------------
        # Proxy common settings
        # ------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;

        # ------------------------------------------------------------------
        # /api/v1/* → NestJS server:3000
        # ------------------------------------------------------------------
        location /api/v1/ {
            # Apply general API rate limiting (burst of 60, no delay)
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://server_upstream;
        }

        # ------------------------------------------------------------------
        # Auth endpoints — stricter rate limiting
        # ------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://server_upstream;
        }

        # ------------------------------------------------------------------
        # /engine/* → FastAPI engine:8000
        # (Internal service — consider restricting access in production)
        # ------------------------------------------------------------------
        location /engine/ {
            limit_req zone=api_limit burst=30 nodelay;

            # Strip /engine prefix before forwarding
            rewrite ^/engine/(.*) /$1 break;
            proxy_pass http://engine_upstream;
        }

        # ------------------------------------------------------------------
        # / → React client (dev server or static build)
        # In production, this should serve static files from a build artifact.
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://client_upstream;

            # WebSocket support (Vite HMR in dev; skip in pure production build)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ------------------------------------------------------------------
        # Static assets caching (when serving built files)
        # ------------------------------------------------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://client_upstream;
            expires    30d;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------------------------------------------
        # Health check endpoint (bypass rate limiting)
        # ------------------------------------------------------------------
        location /health {
            proxy_pass http://server_upstream/health;
            access_log off;
        }
    }
}
