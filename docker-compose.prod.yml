# =============================================================================
# Thena — Production Docker Compose Override
# =============================================================================
# This file extends docker-compose.yml with production-specific services.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# IMPORTANT — Before deploying, update the following:
#   1. Copy .env.example to .env and fill in all production values
#   2. Domain is already set to thena.skynetupb.store in nginx/nginx.conf
#   3. Obtain SSL certs: certbot certonly --webroot -w /var/www/certbot -d thena.skynetupb.store
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — production overrides
  # Remove the host port exposure (only accessible within Docker network)
  # ---------------------------------------------------------------------------
  postgres:
    ports: []
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-thena}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-thena}"

  # ---------------------------------------------------------------------------
  # Redis — production overrides
  # Enable Redis AUTH (P1-18 requirement)
  # IMPORTANT: Set REDIS_PASSWORD in .env, then also update REDIS_URL to:
  #   REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
  # Both the server and engine read REDIS_URL — without the password in the
  # URL they will fail to connect once requirepass is active.
  # ---------------------------------------------------------------------------
  redis:
    ports: []
    restart: unless-stopped
    command: "redis-server --requirepass ${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — production overrides
  # No ports exposed — accessible only within the Docker network.
  # To access the console for maintenance: use an SSH tunnel to the VPS.
  #   ssh -L 9001:localhost:9001 user@your-vps
  # ---------------------------------------------------------------------------
  minio:
    # Pin to a specific RELEASE tag — check https://hub.docker.com/r/minio/minio/tags
    # Format: minio/minio:RELEASE.YYYY-MM-DDTHH-MM-SSZ
    # Example: minio/minio:RELEASE.2025-04-22T22-12-26Z  ← verify before deploying
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports: []
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"

  # ---------------------------------------------------------------------------
  # NestJS server — production overrides
  # Builds the production target: compiles TypeScript, no ts-node, no watch.
  # volumes: [] removes the dev source-code mount from docker-compose.yml.
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
      network: host
    ports: []
    volumes: []
    restart: unless-stopped
    environment:
      NODE_ENV: production

  # ---------------------------------------------------------------------------
  # FastAPI engine — production overrides
  # Builds the production target: uvicorn without --reload.
  # volumes: [] removes the dev source-code mount from docker-compose.yml.
  # ---------------------------------------------------------------------------
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
      target: production
      network: host
    ports: []
    volumes: []
    restart: unless-stopped
    environment:
      APP_ENV: production

  # ---------------------------------------------------------------------------
  # React client — production overrides
  # Builds the production target: static files served by Nginx on port 80.
  # The main Nginx proxy forwards /* to client:80 (updated in nginx/nginx.conf).
  # volumes: [] removes the dev source-code mount from docker-compose.yml.
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      network: host
    ports: []
    volumes: []
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy + SSL termination
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: thena-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from Let's Encrypt (read-only)
      # Obtain with: certbot certonly --webroot -w /var/www/certbot -d your-domain.com
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME challenge directory for cert renewal
      - certbot-webroot:/var/www/certbot
    depends_on:
      - server
      - engine
      - client
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Certbot — automatic SSL certificate renewal
  # Runs every 12 hours and renews certs if they are close to expiry
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:v3.2.0
    container_name: thena-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renew certificates every 12 hours; certbot only acts if expiry is within 30 days
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backup Cron — scheduled pg_dump + MinIO upload
  # Built from scripts/Dockerfile.backup — pg_dump + mc baked in at build time.
  # Runs daily at 02:00 UTC (cron: 0 2 * * *)
  # ---------------------------------------------------------------------------
  backup-cron:
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
      network: host
    container_name: thena-backup-cron
    environment:
      # PostgreSQL connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-thena}"
      POSTGRES_USER: "${POSTGRES_USER:-thena}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      # MinIO connection
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BACKUP_BUCKET: "${MINIO_BACKUP_BUCKET:-thena-backups}"
      # Retention policy
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Additional volumes for production
# ---------------------------------------------------------------------------
volumes:
  certbot-webroot:
  # Base volumes (pg-data, redis-data, minio-data) are inherited from docker-compose.yml
