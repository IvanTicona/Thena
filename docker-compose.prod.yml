# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file ONLY overrides prod-specific settings.
# Base infra definitions (postgres, redis, minio) come from docker-compose.yml.

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    volumes: []  # Remove dev bind mounts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile.prod
    volumes: []  # Remove dev bind mounts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    volumes: []  # Remove dev bind mounts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    ports: []  # Do not expose to host in production
    restart: unless-stopped

  redis:
    ports: []  # Do not expose to host in production
    restart: unless-stopped

  minio:
    restart: unless-stopped
