# =============================================================================
# Thena — Production Docker Compose Override
# =============================================================================
# This file extends docker-compose.yml with production-specific services.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# IMPORTANT — Before deploying, update the following:
#   1. Copy .env.example to .env and fill in all production values
#   2. Domain is already set to lab.skynetupb.store in nginx/nginx.conf
#   3. Obtain SSL certs: certbot certonly --webroot -w /var/www/certbot -d lab.skynetupb.store
#   4. Copy pgbouncer/userlist.txt.example to pgbouncer/userlist.txt and set credentials
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — production overrides
  # Remove the host port exposure (only accessible within Docker network)
  # ---------------------------------------------------------------------------
  postgres:
    ports: []
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-thena}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-thena}"

  # ---------------------------------------------------------------------------
  # Redis — production overrides
  # Enable Redis AUTH (P1-18 requirement)
  # IMPORTANT: Set REDIS_PASSWORD in .env, then also update REDIS_URL to:
  #   REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
  # Both the server and engine read REDIS_URL — without the password in the
  # URL they will fail to connect once requirepass is active.
  # ---------------------------------------------------------------------------
  redis:
    ports: []
    command: "redis-server --requirepass ${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — production overrides
  # Internal-only; only expose console port if needed
  # ---------------------------------------------------------------------------
  minio:
    ports:
      # CHANGE THIS: Remove or restrict console port in production
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"

  # ---------------------------------------------------------------------------
  # NestJS server — production overrides
  # Do NOT expose port directly (Nginx proxies to it)
  # ---------------------------------------------------------------------------
  server:
    ports: []
    environment:
      NODE_ENV: production
    # In production, consider using a pre-built image instead of volume mounts:
    # image: thena-server:latest

  # ---------------------------------------------------------------------------
  # FastAPI engine — production overrides
  # ---------------------------------------------------------------------------
  engine:
    ports: []
    environment:
      APP_ENV: production

  # ---------------------------------------------------------------------------
  # React client — production overrides
  # In production, Nginx should serve the static build artifacts directly.
  # Keep this service if using a dev server; remove if serving static files.
  # ---------------------------------------------------------------------------
  client:
    ports: []

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy + SSL termination
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: thena-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from Let's Encrypt (read-only)
      # Obtain with: certbot certonly --webroot -w /var/www/certbot -d your-domain.com
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME challenge directory for cert renewal
      - certbot-webroot:/var/www/certbot
    depends_on:
      - server
      - engine
      - client
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Certbot — automatic SSL certificate renewal
  # Runs every 12 hours and renews certs if they are close to expiry
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: thena-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renew certificates every 12 hours; certbot only acts if expiry is within 30 days
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PgBouncer — PostgreSQL connection pooling
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: thena-pgbouncer
    environment:
      # edoburu/pgbouncer reads these env vars to auto-generate config
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER:-thena}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_NAME: "${POSTGRES_DB:-thena}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    volumes:
      # Override auto-generated config with our custom files
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      # Applications connect to pgbouncer:6432 instead of postgres:5432
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U thena"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backup Cron — scheduled pg_dump + MinIO upload
  # Alpine container with pg_dump + MinIO client (mc) installed at startup
  # Runs daily at 02:00 UTC (cron: 0 2 * * *)
  # ---------------------------------------------------------------------------
  backup-cron:
    image: alpine:3.19
    container_name: thena-backup-cron
    environment:
      # PostgreSQL connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-thena}"
      POSTGRES_USER: "${POSTGRES_USER:-thena}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      # MinIO connection
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BACKUP_BUCKET: "${MINIO_BACKUP_BUCKET:-thena-backups}"
      # Retention policy
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    # Install dependencies, register cron job, and run crond in foreground
    # Cron expression: 0 2 * * * = daily at 02:00 UTC
    command: >
      sh -c "apk add --no-cache postgresql-client tzdata &&
             wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc &&
             chmod +x /usr/local/bin/mc /scripts/backup.sh &&
             echo '0 2 * * * /scripts/backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
             echo '[INFO] Backup cron scheduled: daily at 02:00 UTC' &&
             crond -f -l 2"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Additional volumes for production
# ---------------------------------------------------------------------------
volumes:
  certbot-webroot:
  # Base volumes (pg-data, redis-data, minio-data) are inherited from docker-compose.yml
