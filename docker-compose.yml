services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thena-postgres
    environment:
      POSTGRES_USER: thena
      POSTGRES_PASSWORD: thena
      POSTGRES_DB: thena
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thena"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thena-redis
    # PRODUCTION NOTE (P1-18): Enable Redis AUTH by adding a command override:
    #   command: redis-server --requirepass <YOUR_STRONG_PASSWORD>
    # And update REDIS_URL in .env to: redis://:<password>@redis:6379
    # Never run Redis without a password in production.
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thena-minio
    environment:
      MINIO_ROOT_USER: thena
      MINIO_ROOT_PASSWORD: thena-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    container_name: thena-server
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
      network: host
    container_name: thena-engine
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./engine:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
    container_name: thena-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  pg-data:
  redis-data:
  minio-data:
